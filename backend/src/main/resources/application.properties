# ============================================================
#   SwissMedPreter — Application Server (on-prem)
# ============================================================

server.port=8080
server.servlet.context-path=/

# Restrict bind address to the hospital LAN interface in production.
# server.address=10.20.0.5

# Logging — verbose during development, INFO in production
logging.level.com.swissmedpreter=DEBUG
logging.level.org.springframework.web.socket=INFO

# Jackson — keep camelCase for the React client, ISO-8601 timestamps
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Health endpoint for the hospital monitoring stack
management.endpoints.web.exposure.include=health,info

# ============================================================
#   Live translation engine (LibreTranslate)
# ============================================================
# Set to the URL of a LibreTranslate instance (e.g. http://libretranslate:5000
# inside docker compose, or http://localhost:5050 if you started it locally).
# Leave blank to fall back to the bundled phrasebook + lexicon mock.
# Can also be set via env var SWISSMEDPRETER_LIBRETRANSLATE_URL.
swissmedpreter.libretranslate.url=${SWISSMEDPRETER_LIBRETRANSLATE_URL:}
swissmedpreter.libretranslate.timeout-ms=3500
